environment_version: "5"
# numpy, pandas, scipy, scikit-learn, and mlflow ship in the serverless v5 base, so they
# are intentionally not pinned here (pinning them overrides the base).
# The ML libraries below are pinned to the v5 versions: this matches the base when it
# includes them and installs the known-good versions if it does not.
dependencies:
  - xgboost==3.1.1
  - lightgbm==4.6.0
  - optuna==3.6.1
  - shap==0.49.1
  # Notebook 05 uses the Data Quality monitoring API (databricks.sdk.service.dataquality),
  # which does not exist in the v5 base sdk (0.67.0); it was added in 0.68.0. This override
  # is required, unlike the base-provided libraries above.
  - databricks-sdk>=0.68.0
