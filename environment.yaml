environment_version: "5"
# numpy, pandas, scipy, scikit-learn, mlflow, and databricks-sdk ship in the serverless
# v5 base, so they are intentionally not pinned here (pinning them overrides the base).
# The ML libraries below are pinned to the v5 versions: this matches the base when it
# includes them and installs the known-good versions if it does not.
dependencies:
  - xgboost==3.1.1
  - lightgbm==4.6.0
  - optuna==3.6.1
  - shap==0.49.1
